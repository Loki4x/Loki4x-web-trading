name: Weekly Calendar Email

# Email berita high impact Senin-Jumat, dikirim Senin pagi.
# Dijadwalkan dua kali karena jadwal GitHub Actions kadang telat/terlewat;
# server hanya mengirim sekali per minggu (penanda cron), jadi tidak ada email ganda.
on:
  schedule:
    - cron: "0 0 * * 1"  # Senin 00:00 UTC = 07:00 WIB
    - cron: "30 1 * * 1" # Senin 01:30 UTC = 08:30 WIB (cadangan)
  workflow_dispatch: {}

jobs:
  weekly-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Kalau secret SITE_URL belum diisi, otomatis pakai domain produksi.
      SITE_URL: ${{ secrets.SITE_URL || 'https://www.loki4xacademy.web.id' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Kirim email kalender mingguan
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Secret CRON_SECRET belum diisi (Settings > Secrets and variables > Actions > Secrets). Nilainya harus sama dengan CRON_SECRET di Vercel."
            exit 1
          fi
          # Sengaja tanpa --retry: pengiriman email massal tidak boleh diulang otomatis.
          curl --fail-with-body -sS --max-time 240 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/cron/weekly-calendar"
