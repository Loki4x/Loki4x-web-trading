name: News Reminders

# CATATAN: jadwal GitHub Actions sering telat 5-15 menit dan bisa terlewat saat ramai.
# Kalau repo PRIVATE, jadwal tiap 5 menit memakan kuota menit gratis (2000/bulan) dengan cepat.
# Alternatif yang lebih tepat waktu & gratis: cron-job.org -> POST ke /api/cron/news-reminders
# dengan header "Authorization: Bearer <CRON_SECRET>". Pakai SALAH SATU saja.
on:
  schedule:
    - cron: "*/5 * * * 1-5" # tiap 5 menit, Senin-Jumat (UTC)
  workflow_dispatch: {}

jobs:
  news-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      # Kalau secret SITE_URL belum diisi, otomatis pakai domain produksi.
      SITE_URL: ${{ secrets.SITE_URL || 'https://www.loki4xacademy.web.id' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Kirim pengingat berita
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Secret CRON_SECRET belum diisi (Settings > Secrets and variables > Actions > Secrets). Nilainya harus sama dengan CRON_SECRET di Vercel."
            exit 1
          fi
          curl --fail-with-body -sS --max-time 60 --retry 2 --retry-delay 5 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/cron/news-reminders"
